<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flip squares</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #263e32;
        background: #f7f6f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 820px;
        margin: auto;
        padding: clamp(20px, 4vw, 64px);
        text-align: center;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 24px;
      }
      p {
        margin: 0 0 clamp(16px, 3vw, 32px);
      }
      [data-board] {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: clamp(10px, 2vw, 24px);
        padding: 0;
        margin: 0;
        list-style: none;
      }
      [data-square] {
        aspect-ratio: 1;
        perspective: 800px;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transition: transform 0.5s ease;
      }
      [data-flipped='true'] .card {
        transform: rotateY(180deg);
      }
      .face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border-radius: 22%;
        border: 1px solid #263e320a;
        backface-visibility: hidden;
      }
      .front {
        background: var(--tile);
      }
      .back {
        background: #263e32;
        color: var(--tile);
        font-size: clamp(28px, 7vw, 90px);
        font-weight: 700;
        transform: rotateY(180deg);
      }
      button {
        margin-top: clamp(16px, 3vw, 32px);
        padding: 6px 14px;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tiles</h1>
      <p>Hover a tile to flip it</p>
      <ul data-board></ul>
      <button type="button" data-reset>Reset</button>
    </main>
    <script>
      const board = document.querySelector('[data-board]');
      const tiles = ['#f7dfca', '#e7e5f0', '#e0ebd5', '#f7e9be', '#dceaf0'];
      const squares = tiles.map((tile, index) => {
        const square = document.createElement('li');
        square.dataset.square = index;
        square.dataset.flipped = 'false';
        square.style.setProperty('--tile', tile);
        square.innerHTML = `<div class="card"><div class="face front"></div><div class="face back">${index + 1}</div></div>`;
        square.addEventListener('pointerenter', () => {
          square.dataset.flipped = square.dataset.flipped === 'true' ? 'false' : 'true';
        });
        return square;
      });
      board.append(...squares);
      document.querySelector('[data-reset]').addEventListener('click', () => {
        squares.forEach((square) => {
          square.dataset.flipped = 'false';
        });
      });
    </script>
  </body>
</html>
